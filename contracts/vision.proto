syntax = "proto3";

package vision;

service VisionProcessor {
  rpc ProcessDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message ProcessDocumentRequest {
  string file_ref = 1;
  string mime_type = 2;
  map<string, string> options = 3;
}

message ExtractedBlock {
  int32 line_number = 1;
  string text = 2;
  float confidence = 3;
}

message ProcessDocumentResponse {
  repeated ExtractedBlock extracted_blocks = 1;
  string engine = 2;
  bool used_fallback = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string service_name = 2;
}
