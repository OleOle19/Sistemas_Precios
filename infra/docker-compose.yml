services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: sistemas_precios_v2
      POSTGRES_USER: precios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U precios -d sistemas_precios_v2']
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_v2_data:/var/lib/postgresql
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=sistemas_precios_v2;Username=precios;Password=${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Configura OPENAI_API_KEY}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@precios.local}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Configura BOOTSTRAP_PASSWORD}
      Storage__RootPath: /app/storage
      ASPNETCORE_ENVIRONMENT: Production
      Web__Origins__0: http://localhost:3000
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - api_v2_storage:/app/storage
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - 127.0.0.1:3000:3000
volumes:
  postgres_v2_data:
  api_v2_storage:
